name: CD Deploy

# Deployment only:
# Run directly on push to main after PR CI and branch protection have already
# validated the merge, then publish the image and trigger Coolify.
on:
  push:
    branches:
      - main

# Ensure only one production deployment runs at a time.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  image:
    name: Build and publish image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ghcr.io/lucaknobel/decision-analysis-app
      IMAGE_TAG_SHA: ${{ github.sha }}

    steps:
      - name: Checkout pushed commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build the image exactly once and load it into the local Docker daemon
      # so Trivy can scan the same artifact before we push it.
      # This workflow currently builds linux/amd64 only.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          pull: true
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DATABASE_URL=postgresql://build:build@localhost:5432/build
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.IMAGE_TAG_SHA }}

      # Security scan for the locally built image (report only, never blocks the deploy)
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        timeout-minutes: 10
        with:
          scan-type: "image"
          image-ref: "${{ env.IMAGE }}:${{ env.IMAGE_TAG_SHA }}"
          format: "table"
          output: "trivy-report.txt"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          vuln-type: "os,library"
          list-all-pkgs: false
          exit-code: "0"

      - name: Publish Trivy report
        if: always()
        run: |
          set -euo pipefail
          if [ ! -s trivy-report.txt ]; then
            echo "No CRITICAL or HIGH findings." > trivy-report.txt
          fi
          echo "Trivy scan for ${IMAGE}:${IMAGE_TAG_SHA}"
          cat trivy-report.txt
          {
            echo "## Container Security Scan"
            echo ""
            echo "Image: ${IMAGE}:${IMAGE_TAG_SHA}"
            echo ""
            echo '```'
            cat trivy-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Push the exact image that was scanned above.
      - name: Push image
        run: |
          docker push "${IMAGE}:${IMAGE_TAG_SHA}"
          docker push "${IMAGE}:latest"

  deploy:
    name: Deploy to Coolify (Production)
    runs-on: ubuntu-latest
    environment: production

    needs: image

    permissions:
      contents: read

    steps:
      - name: Deployment summary
        run: |
          echo "Deployment environment: production"
          echo "Deployed image tag: ${{ github.sha }}"

      # Coolify pulls the freshly pushed image and restarts the application.
      - name: Trigger Coolify deploy webhook
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_AUTH_TOKEN: ${{ secrets.COOLIFY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${COOLIFY_AUTH_TOKEN}" \
            "${COOLIFY_WEBHOOK}"
